name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 è la versione inclusa in Electron 33; 24 è la più recente
        # usata in sviluppo. I test non richiedono Electron.
        node: [20, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # @electron/rebuild di electron-builder 25 usa node-gyp 9, che importa
      # `distutils`: rimosso da Python 3.12. Il pacchetto setuptools fornisce
      # lo shim necessario alla compilazione di better-sqlite3.
      - name: Prepare Python for node-gyp
        run: python3 -m pip install --break-system-packages setuptools || python3 -m pip install setuptools

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run tests against the Electron ABI
        run: npm run test:electron
